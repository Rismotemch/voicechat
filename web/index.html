<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceChat GTNH</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-accent: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        /* Container & Cards */
        .app-container {
            width: 100%;
            max-width: 960px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 85vh;
        }

        /* Login View */
        .login-card {
            max-width: 420px;
            width: 100%;
            margin: auto;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .login-card h2 {
            text-align: center;
            font-weight: 700;
            color: var(--text-main);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        input,
        select,
        button {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        input:focus,
        select:focus {
            border-color: var(--accent-color);
        }

        button {
            cursor: pointer;
            background: var(--accent-color);
            border: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--accent-hover);
        }

        /* Room Header */
        .room-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            background: var(--bg-accent);
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge.active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        /* Room Main Layout */
        .room-body {
            display: grid;
            grid-template-columns: 280px 1fr;
            flex: 1;
            overflow: hidden;
        }

        /* Users Sidebar */
        .sidebar {
            border-right: 1px solid var(--border);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: rgba(15, 23, 42, 0.3);
            overflow-y: auto;
        }

        .users-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem;
            border-radius: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .user-card.speaking {
            border-color: var(--success-color);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: #fff;
        }

        .user-info .name {
            font-size: 0.875rem;
            font-weight: 600;
        }

        .user-info .status {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Chat & Controls Area */
        .main-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .chat-msg {
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .chat-msg strong {
            color: var(--accent-color);
        }

        .chat-controls {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
            background: rgba(15, 23, 42, 0.4);
        }

        .chat-controls input {
            flex: 1;
        }

        /* Footer Controls */
        .footer-controls {
            padding: 0.85rem 1.5rem;
            border-top: 1px solid var(--border);
            background: var(--bg-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .audio-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        button.muted {
            background: var(--danger-color);
        }

        button.leave-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        button.leave-btn:hover {
            background: var(--bg-accent);
            color: var(--text-main);
        }
    </style>
</head>

<body>

    <!-- Login & Connect Screen -->
    <div id="login-screen" class="login-card">
        <h2>VoiceChat GTNH</h2>
        <div class="form-group">
            <label for="username-input">Игровой никнейм (как на сервере)</label>
            <input type="text" id="username-input" placeholder="Player" autocomplete="off">
        </div>
        <div class="form-group">
            <label for="room-select">Выберите комнату</label>
            <select id="room-select"></select>
        </div>
        <div class="form-group">
            <label for="room-password-input">Пароль (если требуется)</label>
            <input type="password" id="room-password-input" placeholder="••••••">
        </div>
        <button id="connect-btn">Войти в канал</button>
    </div>

    <!-- Active Room Screen -->
    <div id="room-screen" class="app-container hidden">
        <header class="room-header">
            <div class="header-meta">
                <h2>Голосовой эфир</h2>
                <span id="mc-status-badge" class="badge">Minecraft: Ожидание</span>
            </div>
            <div class="header-meta">
                <span class="badge">RTT: <span id="ping-display">0 ms</span></span>
                <button id="leave-btn" class="leave-btn">Отключиться</button>
            </div>
        </header>

        <div class="room-body">
            <aside class="sidebar">
                <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">
                    Участники
                </div>
                <div id="users-list" class="users-list"></div>
            </aside>

            <main class="main-content">
                <div id="chat-messages" class="chat-messages"></div>
                <div class="chat-controls">
                    <input type="text" id="chat-input" placeholder="Написать сообщение в эфир..." autocomplete="off">
                    <button id="send-chat-btn">Отправить</button>
                </div>
            </main>
        </div>

        <footer class="footer-controls">
            <div class="audio-actions">
                <button id="mic-toggle-btn">Заглушить микрофон</button>
                <div class="form-group" style="margin: 0; flex-direction: row; align-items: center; gap: 0.5rem;">
                    <label for="filter-select" style="margin: 0;">DSP Фильтр:</label>
                    <select id="filter-select" style="padding: 0.4rem 0.8rem;">
                        <option value="none">Стандартный (Clear)</option>
                        <option value="radio">Рация (Walkie-Talkie)</option>
                        <option value="robot">Робот (RingMod)</option>
                        <option value="megaphone">Мегафон (BandPass)</option>
                        <option value="demon">Демон (Pitch/LPF)</option>
                    </select>
                </div>
            </div>
        </footer>
    </div>

    <script src="js/audio-processor.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/spatial.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
