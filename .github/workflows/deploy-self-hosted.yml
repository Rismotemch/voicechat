name: Deploy Self-Hosted

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install npm dependencies
        run: npm install
        
      - name: Build frontend
        run: npm run build
      
      - name: Deploy
        run: |
          cd /opt/voicechat
          git reset --hard
          git pull
          npm install
          npm run build
          docker stop voicechat || true
          docker rm voicechat || true
          docker compose build --no-cache
          docker compose up -d