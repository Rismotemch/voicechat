services:
  voicechat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicechat
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Серверные параметры
      - PORT=8080
      - DOMAIN=voice.repozis.ru
      - ENVIRONMENT=production

      # Настройки голосовых комнат и DSP
      - DEFAULT_ROOM_NAME=main
      - MAX_USERS=10
      - AUDIO_SAMPLE_RATE=16000
      - AUDIO_FRAME_MS=20

      # Безопасность
      - REQUIRE_AUTH=false
      - ALLOW_ORIGIN=*

      # Логирование
      - LOG_LEVEL=info
      - LOG_FORMAT=json

      # Хранилище
      - UPLOAD_PATH=/app/data/uploads
      - MAX_UPLOAD_SIZE=52428800 # 50 MB
    volumes:
      - ./data:/app/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
