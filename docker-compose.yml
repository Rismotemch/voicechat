version: '3.8'

services:
  voicechat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicechat
    restart: unless-stopped

    environment:
      - PORT=8080
      - DOMAIN=voice.repozis.ru
      - ENVIRONMENT=production
      - ROOM_NAME=main
      - MAX_USERS=25
      - UDP_MIN=50000
      - UDP_MAX=50100
      - STUN_SERVERS=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      - TURN_SERVERS=turn:voice.repozis.ru:3478,turn:voice.repozis.ru:3478?transport=tcp
      - REQUIRE_AUTH=false
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
      - UPLOAD_PATH=/app/data/uploads
      - MAX_UPLOAD_SIZE=104857600

    ports:
      - "8080:8080"
      - "50000-50100:50000-50100/udp"
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"

    volumes:
      - ./data:/app/data

    networks:
      - voicechat-network

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  voicechat-network:
    driver: bridge
